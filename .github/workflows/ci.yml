name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # CPU-only torch first: the default wheel bundles CUDA and is several GB larger.
        # kiri-ocr with --no-deps: its declared deps (onnxruntime-gpu, datasets, ...) are unused.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,kiri]"
          pip install --no-deps "kiri-ocr==0.2.15"

      - name: Cache Kiri weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump when MODEL_REVISION in src/khmer_kyc_ocr/pipeline/kiri.py changes.
          key: kiri-7661ff6f27cb

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Types
        run: mypy src tests spike

      - name: Tests (includes the real-model integration test)
        run: pytest -rs
