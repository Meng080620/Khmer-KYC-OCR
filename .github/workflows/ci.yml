name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # CPU-only torch first: the default wheel bundles CUDA and is several GB larger.
        # kiri-ocr with --no-deps: its declared deps (onnxruntime-gpu, datasets, ...) are unused.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,kiri]"
          pip install --no-deps "kiri-ocr==0.2.15"

      - name: Cache Kiri weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump when MODEL_REVISION in src/khmer_kyc_ocr/pipeline/kiri.py changes.
          key: kiri-7661ff6f27cb

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Types
        run: mypy src tests spike

      - name: Tests (includes the real-model integration test)
        run: pytest -rs

  docker:
    # Proves the Dockerfile's promise: the image builds with weights baked in and the
    # service starts and loads the model with NO network at all (--network none).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t khmer-kyc-ocr .

      - name: Start offline and wait for the model to load
        run: |
          docker run -d --name ocr --network none -e KYC_OCR_API_TOKEN=ci-token -e WORKERS=1 khmer-kyc-ocr
          for i in $(seq 1 60); do
            status=$(docker exec ocr python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['status'])" 2>/dev/null || true)
            if [ "$status" = "ok" ]; then echo "healthy offline after ~$((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "service never became healthy"; docker logs ocr; exit 1

      - name: Image size
        if: always()
        run: docker image ls khmer-kyc-ocr --format '{{.Repository}} {{.Size}}'
